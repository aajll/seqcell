[package]
name = "seqcell"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A sequence-lock cell: a writer publishes a multi-word value and any number of readers copy it whole, with no data race"
license = "MIT"
repository = "https://github.com/aajll/seqcell"
readme = "README.md"
keywords = ["seqlock", "lock-free", "atomic", "no-std", "concurrency"]
categories = ["concurrency", "no-std", "no-std::no-alloc", "embedded"]
exclude = [".github/"]

[dependencies]
# `min_const_generics` makes an array of any length a payload.
bytemuck = { version = "1.16", default-features = false, features = ["min_const_generics"] }

[dev-dependencies]
bytemuck = { version = "1.16", default-features = false, features = ["derive", "min_const_generics"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
