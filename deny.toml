# cargo-deny policy. The graph is checked with dev-dependencies excluded so
# the gate describes what a consumer links.

[graph]
all-features = true
exclude-dev = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
# bytemuck is offered under Zlib, Apache-2.0 or MIT.
allow = ["MIT"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
